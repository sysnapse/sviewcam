name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一條分支連推時取消前一次，省 runner 時間。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + replay + mutant harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 快取 cargo registry 與 target；key 綁 Cargo.lock，lock 不變就只編改動的 crate。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 驗收標準 1：workspace 全測試（目前 29 passed / 0 failed）。
      - name: cargo test --workspace
        run: cargo test --workspace

      # 驗收標準 2：fixture 重放要走同一條重連狀態機，且宣告值全部符合。
      # 在 CI 上另外斷言「fixture 期望全部符合」這句話確實出現在輸出裡，
      # 避免只看 exit code（fixture 沒宣告 expected 時 check 會什麼都不比對而仍 exit 0）。
      - name: replay fixture
        shell: bash
        run: |
          set -o pipefail
          cargo run -p replay -- \
            --input fixtures/sview-m0.jsonl \
            --report /tmp/report.json \
            --annexb /tmp/session.h264 | tee /tmp/replay.log
          grep -q 'fixture 期望全部符合' /tmp/replay.log

      # 驗收標準 2：變異測試 harness 證明重連測試有鑑別力（good 全綠 + 6 個 mutant 全檢出）。
      - name: mutant harness
        run: sh scripts/mutant_harness.sh
