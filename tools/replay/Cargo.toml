[package]
name = "replay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M0 spike: replay a recorded SView session without a camera"

[[bin]]
name = "replay"
path = "src/main.rs"

[dependencies]
rtsp-core = { path = "../../crates/rtsp-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
