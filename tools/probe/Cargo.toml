[package]
name = "probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M0 spike: open the SView stream for N seconds and print statistics"

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
rtsp-core = { path = "../../crates/rtsp-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
